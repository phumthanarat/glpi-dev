# Template only — do not commit the real one.
#
# Create the actual secret imperatively instead (values never touch a file
# on disk in plain text this way):
#
#   kubectl create secret generic db-external \
#     --namespace glpi \
#     --from-literal=host=mariadb \
#     --from-literal=port=3306 \
#     --from-literal=database=glpi \
#     --from-literal=user=glpi \
#     --from-literal=password='<your-password>'
#
# The stand-in values above point at the in-cluster mariadb Deployment
# from overlays/local-dev (see mariadb-deployment.yaml there), reachable
# in-cluster via the `mariadb` Service. Swap host/port/user/password for
# a real external database whenever one exists — nothing else in k8s/
# needs to change.
apiVersion: v1
kind: Secret
metadata:
  name: db-external
  namespace: glpi
type: Opaque
stringData:
  host: CHANGEME_HOST
  port: "3306"
  database: glpi
  user: CHANGEME_USER
  password: CHANGEME_PASSWORD
