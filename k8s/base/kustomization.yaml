apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - cronjob.yaml
  - daily-summary-cronjob.yaml
  - backup-cronjob.yaml
  - https-rbac.yaml

# secret-db-external.example.yaml is NOT listed here on purpose — it's a
# template, not something to apply. Create the real "db-external" Secret
# per-cluster (see its own comments), or add your own secret manifest in
# the overlay that uses this base.
