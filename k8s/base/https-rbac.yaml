# Setup > HTTPS (ithttps plugin) replaces the Ingress certificate from GLPI: the app pods (and
# glpi-cron, which renews an internal certificate) may read / update exactly two Secrets:
#   glpi-tls     the certificate the Ingress serves (tls.crt, tls.key)
#   glpi-tls-ca  the internal CA used for "internal certificate" mode (+ settings)
# No create / list / delete, no other Secret (resourceNames). install.sh creates both, empty.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glpi-app
  namespace: glpi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glpi-tls-manager
  namespace: glpi
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["glpi-tls", "glpi-tls-ca"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glpi-tls-manager
  namespace: glpi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: glpi-tls-manager
subjects:
  - kind: ServiceAccount
    name: glpi-app
    namespace: glpi
