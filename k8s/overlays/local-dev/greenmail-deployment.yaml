# Local-dev-only test mailbox (IMAP + SMTP) for the e-mail ticket channel:
# GLPI's Mail Receiver reads it-support@dev.glpi.labs over IMAP
# (greenmail:3143), and tests "send" user e-mails into it over SMTP
# (greenmail:3025). mailpit can't stand in here: it has no IMAP.
#
# The mailbox account and its password come from the mail-intake Secret
# (see mail-intake-secret.example.yaml), the same values GLPI uses.
#
# In-memory: the mailbox is emptied on every pod restart. Fine for a test
# mailbox; GLPI keeps the tickets it already imported.
# Only reachable inside the cluster (no NodePort).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenmail
  namespace: glpi
  labels:
    app: greenmail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenmail
  template:
    metadata:
      labels:
        app: greenmail
    spec:
      containers:
        - name: greenmail
          image: greenmail/standalone:2.1.3
          env:
            - name: MAIL_INTAKE_LOGIN
              valueFrom: { secretKeyRef: { name: mail-intake, key: MAIL_INTAKE_LOGIN } }
            - name: MAIL_INTAKE_PASSWORD
              valueFrom: { secretKeyRef: { name: mail-intake, key: MAIL_INTAKE_PASSWORD } }
            - name: GREENMAIL_OPTS
              value: >-
                -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
                -Dgreenmail.hostname=0.0.0.0
                -Dgreenmail.users=$(MAIL_INTAKE_LOGIN):$(MAIL_INTAKE_PASSWORD)@dev.glpi.labs
                -Dgreenmail.verbose
          ports:
            - name: smtp
              containerPort: 3025
            - name: imap
              containerPort: 3143
          readinessProbe:
            tcpSocket: { port: 3143 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 3143 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 384Mi }
