# Template only — do not commit the real one.
#
# Create the actual secret imperatively instead:
#
#   kubectl create secret generic mariadb-local --namespace glpi \
#     --from-literal=MARIADB_DATABASE=glpi \
#     --from-literal=MARIADB_USER=glpi \
#     --from-literal=MARIADB_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MARIADB_ROOT_PASSWORD="$(openssl rand -base64 24)"
#
# This backs the local-dev-only mariadb Deployment (see
# mariadb-deployment.yaml). Use the same MARIADB_USER/MARIADB_PASSWORD
# values for the db-external Secret's user/password, with host=mariadb
# and port=3306.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-local
  namespace: glpi
type: Opaque
stringData:
  MARIADB_DATABASE: glpi
  MARIADB_USER: glpi
  MARIADB_PASSWORD: CHANGEME_PASSWORD
  MARIADB_ROOT_PASSWORD: CHANGEME_ROOT_PASSWORD
