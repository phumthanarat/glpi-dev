# Template only — do not commit the real one.
#
# The mailbox GLPI's Mail Receiver reads to turn e-mails into tickets
# (customizations/setup-19-mail-intake.php reads these values).
#
# local-dev: points at the in-cluster greenmail test mailbox
# (greenmail-deployment.yaml), which also takes its password from here:
#
#   kubectl create secret generic mail-intake --namespace glpi \
#     --from-literal=MAIL_INTAKE_ADDRESS=it-support@dev.glpi.labs \
#     --from-literal=MAIL_INTAKE_LOGIN=it-support \
#     --from-literal=MAIL_INTAKE_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal='MAIL_INTAKE_HOST={greenmail:3143/imap/notls}INBOX'
#
# production: same Secret name, the real mailbox instead, e.g.
#   MAIL_INTAKE_HOST={imap.company.com:993/imap/ssl}INBOX
# (a Microsoft 365 / Google mailbox needs an OAuth app instead of a
# password; see customizations/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: mail-intake
  namespace: glpi
type: Opaque
stringData:
  MAIL_INTAKE_ADDRESS: it-support@dev.glpi.labs
  MAIL_INTAKE_LOGIN: it-support
  MAIL_INTAKE_PASSWORD: CHANGEME_PASSWORD
  MAIL_INTAKE_HOST: "{greenmail:3143/imap/notls}INBOX"
