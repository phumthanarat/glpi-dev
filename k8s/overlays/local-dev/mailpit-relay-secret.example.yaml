# Template only — do not commit the real one.
#
# Enables mailpit's "Release" feature (its resend/forward): with this
# Secret present, any captured message can be relayed out through a
# real SMTP server, either from the web UI (message -> Release) or the
# API (POST /api/v1/message/{ID}/release). Without it, mailpit only
# captures — nothing to fill in yet, so this is pending real relay
# credentials (see k8s/README.md).
#
# Create the actual secret imperatively once you have a real relay:
#
#   kubectl create secret generic mailpit-relay --namespace glpi \
#     --from-literal=MP_SMTP_RELAY_HOST=<smtp-host> \
#     --from-literal=MP_SMTP_RELAY_PORT=587 \
#     --from-literal=MP_SMTP_RELAY_USERNAME=<smtp-user> \
#     --from-literal=MP_SMTP_RELAY_PASSWORD='<smtp-password>' \
#     --from-literal=MP_SMTP_RELAY_SECURE=starttls \
#     --from-literal=MP_SMTP_RELAY_ALLOWED_RECIPIENTS='<regex, e.g. .*@yourcompany\.com>'
#
# Then restart the deployment to pick it up:
#   kubectl rollout restart deployment/mailpit --namespace glpi
#
# MP_SMTP_RELAY_SECURE is one of: none | starttls | tls
# MP_SMTP_RELAY_ALLOWED_RECIPIENTS is a regex allowlist — strongly
# recommended so "Release" can't be used to relay to arbitrary
# addresses; leave unset only if that's genuinely fine for this env.
apiVersion: v1
kind: Secret
metadata:
  name: mailpit-relay
  namespace: glpi
type: Opaque
stringData:
  MP_SMTP_RELAY_HOST: CHANGEME_SMTP_HOST
  MP_SMTP_RELAY_PORT: "587"
  MP_SMTP_RELAY_USERNAME: CHANGEME_SMTP_USER
  MP_SMTP_RELAY_PASSWORD: CHANGEME_SMTP_PASSWORD
  MP_SMTP_RELAY_SECURE: starttls
  MP_SMTP_RELAY_ALLOWED_RECIPIENTS: CHANGEME_RECIPIENT_ALLOWLIST_REGEX
