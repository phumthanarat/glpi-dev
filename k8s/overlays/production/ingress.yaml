# Requires the Kong Ingress Controller installed on the target cluster
# (see ../../INSTALL-production.md).
#
# Replace glpi.example.com with the real hostname before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glpi-app
  namespace: glpi
  annotations:
    # HTTPS only: plain HTTP is redirected (certificate: Secret glpi-tls, Setup > HTTPS)
    konghq.com/protocols: https
    konghq.com/https-redirect-status-code: "301"
    konghq.com/strip-path: "false"
    # TLS: once cert-manager (or another ACME client) is set up on the
    # target cluster, add:
    #   cert-manager.io/cluster-issuer: letsencrypt-prod
    # and a `tls:` block below pointing at a Secret it creates.
spec:
  ingressClassName: kong
  tls:
    - hosts: [glpi.example.com]
      secretName: glpi-tls
  rules:
    - host: glpi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glpi-app
                port:
                  number: 8080
