<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # GLPI's public/ ships no .htaccess: everything that isn't a real
        # static file (css/js/pics/...) goes to the front controller, which does
        # its own routing - including *.php URLs that don't exist as files, like
        # /status.php (monitoring) and /apirest.php (REST API). FallbackResource
        # missed those: the PHP handler answered 404 before any fallback.
        RewriteEngine On
        # keep the Authorization header for the API
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    # HTTPS ends at the Ingress (Kong), which forwards plain HTTP with X-Forwarded-Proto.
    # Tell PHP / GLPI the request was secure, and send the session cookie with the Secure flag
    # then; plain-HTTP access (the dev NodePort) keeps working with a normal cookie.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <If "%{HTTP:X-Forwarded-Proto} == 'https'">
        php_value session.cookie_secure 1
    </If>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
