<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # GLPI's public/ ships no .htaccess: everything that isn't a real
        # static file (css/js/pics/...) must fall back to the front
        # controller, which does its own internal routing.
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
